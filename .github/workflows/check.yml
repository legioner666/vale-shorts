name: check

# One-tap health check: writes reports/CHECK.md (privacy, processing, Content ID blocks) for every uploaded video. Changes nothing on YouTube.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      GH_TOKEN: ${{ github.token }}
      MODE: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run
        run: python scripts/publish.py --mode check
      - name: Report
        if: always() && env.MODE == 'queue'
        run: python scripts/publish.py --mode report || echo "report skipped"
      - name: Save ledger and report
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add publish/ledger.json
          if [ -f reports/REPORT.md ]; then git add reports/REPORT.md; fi
          git diff --cached --quiet || (git commit -m "publish: $MODE $(date -u +%F)" && git push)
